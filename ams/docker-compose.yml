services:
  # ---------- data ----------
  db:
    image: postgres:16-alpine
    container_name: ams-db
    environment:
      POSTGRES_DB: ams
      POSTGRES_USER: ams
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ams_dev_password}
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ams -d ams"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: ams-redis
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # ---------- object storage (bid documents, contracts, PDFs) ----------
  minio:
    image: minio/minio:latest
    container_name: ams-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-ams}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-ams_dev_password}
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6

  # ---------- application ----------
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ams-api
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ams
      DB_USER: ams
      DB_PASSWORD: ${DB_PASSWORD:-ams_dev_password}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      OBJECT_STORE_ENDPOINT: http://minio:9000
      ALLOWED_ORIGINS: http://localhost:8080
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_started }
    ports: ["4000:4000"]

  # ---------- outbox dispatcher and batch workers ----------
  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ams-worker
    command: ["node", "src/workers/index.js"]
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_NAME: ams
      DB_USER: ams
      DB_PASSWORD: ${DB_PASSWORD:-ams_dev_password}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    # Workers scale on outbox depth, not on request rate.
    deploy:
      replicas: 2

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ams-web
    ports: ["8080:80"]
    depends_on: [api]

  # ---------- observability ----------
  prometheus:
    image: prom/prometheus:latest
    container_name: ams-prometheus
    ports: ["9090:9090"]
    volumes: ["./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]

  grafana:
    image: grafana/grafana:latest
    container_name: ams-grafana
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes: [grafanadata:/var/lib/grafana]
    depends_on: [prometheus]

volumes:
  pgdata:
  redisdata:
  miniodata:
  grafanadata:
