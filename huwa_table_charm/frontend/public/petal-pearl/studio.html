<script src="/petal-pearl/three.min.js"></script>
<script>
(()=>{
const root=document.getElementById('charm-huwa');if(!root)return;
const T=globalThis.THREE,container=root.querySelector('#solar-canvas');
if(!T){root.querySelector('#solar-loading').textContent='The 3D library could not load.';return;}
const finishes={kiln:{color:'#d9a6ac',rough:.23,foot:'#bc965a',metal:.72},chalk:{color:'#f3e9df',rough:.2,foot:'#bc965a',metal:.72},basalt:{color:'#694451',rough:.25,foot:'#bc965a',metal:.72},sage:{color:'#b8c3a5',rough:.25,foot:'#bc965a',metal:.72}};
const state={object:'collection',finish:'kiln',lighting:'daylight',explode:0,dimensions:false};
const descriptors={collection:'Four porcelain concepts. Petal contours with champagne accents.',pitcher:'Bloom Carafe / 270 mm tall / sculpted loop handle / proposed 1.2 litre capacity.',cup:'Ribbon Cup / 105 mm tall / ribbon handle / proposed 300 ml capacity.',bowl:'Petal Bowl / 190 mm wide / scalloped rim / recessed ceramic foot.',plate:'Pearl Plate / 270 mm wide / twelve petal rim / champagne edge.'};
let seed=1381;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646;};
function texture(){const c=document.createElement('canvas');c.width=c.height=512;const cx=c.getContext('2d');cx.fillStyle='#e0dfd9';cx.fillRect(0,0,512,512);for(let n=0;n<30000;n++){const grey=150+Math.round(rnd()*100);cx.fillStyle=`rgba(${grey},${grey},${grey},${.03+rnd()*.1})`;cx.fillRect(rnd()*512,rnd()*512,.5+rnd()*1.8,.5+rnd()*1.8);}for(let n=0;n<1800;n++){cx.fillStyle=`rgba(78,71,60,${rnd()*.18})`;cx.beginPath();cx.arc(rnd()*512,rnd()*512,.1+rnd()*.6,0,6.3);cx.fill();}const tx=new T.CanvasTexture(c);tx.wrapS=tx.wrapT=T.RepeatWrapping;tx.colorSpace=T.SRGBColorSpace;return tx;}
const grain=texture();
const ceramic=new T.MeshPhysicalMaterial({color:finishes.kiln.color,map:grain,bumpMap:grain,bumpScale:.015,roughness:.56,metalness:.03,clearcoat:.7,clearcoatRoughness:.18});
const footMat=new T.MeshStandardMaterial({color:'#252e29',roughness:.35,metalness:.18});
const inside=ceramic;
const renderer=new T.WebGLRenderer({alpha:false,antialias:true,preserveDrawingBuffer:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1;renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;container.appendChild(renderer.domElement);
const scene=new T.Scene();scene.background=new T.Color('#473b40');scene.fog=new T.Fog('#473b40',17,32);
const camera=new T.PerspectiveCamera(34,1,.1,100);let yaw=.4,pitch=.28,distance=12,target=new T.Vector3(.75,1,0);
const ambient=new T.HemisphereLight('#f1e5c6','#334136',1.4);scene.add(ambient);
const key=new T.DirectionalLight('#fff1cf',4.3);key.position.set(-4.5,7,4.8);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-7;key.shadow.camera.right=7;key.shadow.camera.top=7;key.shadow.camera.bottom=-7;key.shadow.normalBias=.028;key.shadow.bias=-.00008;key.shadow.radius=5;scene.add(key);
const rim=new T.DirectionalLight('#efd4a7',3);rim.position.set(4,5,-5);scene.add(rim);
const fill=new T.DirectionalLight('#a3bfd4',.75);fill.position.set(5,2,5);scene.add(fill);
const studio=new T.Scene();studio.background=new T.Color('#b3ae9c');const room=new T.Mesh(new T.BoxGeometry(20,15,20),new T.MeshBasicMaterial({color:'#6b7467',side:T.BackSide}));studio.add(room);[[ -6,6,3,7,9,5],[5,5,0,5,9,3],[0,9,-3,12,10,2]].forEach(([x,y,z,w,h,b])=>{const p=new T.Mesh(new T.PlaneGeometry(w,h),new T.MeshBasicMaterial({color:new T.Color(b,b,b)}));p.position.set(x,y,z);p.lookAt(0,1,0);studio.add(p);});const pm=new T.PMREMGenerator(renderer);scene.environment=pm.fromScene(studio,.015).texture;pm.dispose();
const ground=new T.Mesh(new T.PlaneGeometry(80,80),new T.MeshStandardMaterial({color:'#4d4146',roughness:.83,metalness:.05}));ground.rotation.x=-Math.PI/2;ground.position.y=-.20;ground.receiveShadow=true;scene.add(ground);
const plinthMat=new T.MeshStandardMaterial({color:'#ad8991',roughness:.8,metalness:.06});
const stage=new T.Group();const pedestal=new T.Mesh(new T.CylinderGeometry(3.4,3.42,.16,120),plinthMat);pedestal.position.set(.85,-.1,0);pedestal.receiveShadow=true;pedestal.castShadow=true;stage.add(pedestal);scene.add(stage);
const archMat=new T.MeshStandardMaterial({color:'#b68e77',roughness:.95});const arch=new T.Mesh(new T.TorusGeometry(2.8,.065,12,140,Math.PI),archMat);arch.position.set(1.8,0,-3.4);scene.add(arch);
const assetRoot=new T.Group();scene.add(assetRoot);
function mesh(g,mat,name){const m=new T.Mesh(g,mat);m.name=name;m.castShadow=true;m.receiveShadow=true;return m;}
function profileMesh(profile,material,name,{flutes=0,amp=0,organic=0,spout=0}={}){const steps=160,positions=[],uvs=[],idx=[];for(let j=0;j<profile.length;j++){const[r,y]=profile[j];for(let i=0;i<=steps;i++){const a=i/steps*Math.PI*2;const ripple=1+amp*Math.cos(flutes*a);const rr=r*ripple*(1+organic*Math.sin(3*a));const top=Math.max(0,(y-2.15)/.5);const lip=spout*Math.pow(Math.max(0,-Math.cos(a)),12)*Math.pow(top,3);positions.push((rr+lip)*Math.cos(a),y+organic*.16*Math.sin(2*a),rr*Math.sin(a));uvs.push(i/steps,j/profile.length);}}for(let j=0;j<profile.length-1;j++)for(let i=0;i<steps;i++){const a=j*(steps+1)+i,b=a+steps+1;idx.push(a,b,a+1,b,b+1,a+1);}const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(positions,3));g.setAttribute('uv',new T.Float32BufferAttribute(uvs,2));g.setIndex(idx);g.computeVertexNormals();return mesh(g,material,name);}
function makePitcher(){const g=new T.Group();g.name='Bloom Carafe';const body=profileMesh([[0,.11],[.35,.11],[.57,.15],[.69,.24],[.74,.45],[.79,.85],[.8,1.23],[.77,1.57],[.7,1.85],[.59,2.12],[.53,2.34],[.56,2.56],[.61,2.65],[.60,2.685],[.56,2.69],[.53,2.65],[.49,2.55],[.465,2.34],[.52,2.14],[.635,1.86],[.7,1.56],[.73,1.23],[.72,.85],[.665,.46],[.59,.29],[.47,.22],[0,.22]],ceramic,'Pitcher ceramic shell',{flutes:16,amp:.035,spout:.17});body.userData.part='body';g.add(body);const h=mesh(new T.TorusGeometry(.65,.092,28,160),ceramic,'Pitcher circular handle');h.position.set(.96,1.57,0);h.userData.part='handle';g.add(h);const ring=mesh(new T.TorusGeometry(.65,.012,12,160),footMat,'Handle inset');ring.position.set(.96,1.57,.09);ring.userData.part='handle';g.add(ring);const foot=mesh(new T.CylinderGeometry(.565,.54,.115,120),footMat,'Pitcher contrasting foot');foot.position.y=.065;foot.userData.part='foot';g.add(foot);const neck=profileMesh([[.563,2.648],[.607,2.674],[.588,2.705],[.545,2.684]],ceramic,'Pitcher rolled lip',{spout:.17});neck.userData.part='lip';g.add(neck);return g;}
function makeCup(){const g=new T.Group();g.name='Ribbon Cup';const body=profileMesh([[0,.09],[.34,.09],[.45,.14],[.47,.22],[.495,.62],[.52,.94],[.53,1.01],[.515,1.046],[.481,1.046],[.465,1.01],[.454,.95],[.435,.63],[.409,.25],[.36,.19],[0,.19]],ceramic,'Cup ceramic shell',{flutes:12,amp:.052});body.userData.part='body';g.add(body);const curve=new T.CatmullRomCurve3([new T.Vector3(-.2,-.27,0),new T.Vector3(.12,-.37,0),new T.Vector3(.37,-.06,.03),new T.Vector3(.27,.3,0),new T.Vector3(.04,.34,-.03),new T.Vector3(-.18,.2,0)],true);const h=mesh(new T.TubeGeometry(curve,120,.065,20,true),ceramic,'Cup ribbon handle');h.position.set(.7,.61,0);h.userData.part='handle';g.add(h);const f=mesh(new T.CylinderGeometry(.41,.395,.10,96),footMat,'Cup contrasting foot');f.position.y=.054;f.userData.part='foot';g.add(f);return g;}
function makeBowl(){const g=new T.Group();g.name='Petal Bowl';const b=profileMesh([[0,.06],[.32,.06],[.4,.1],[.47,.18],[.63,.32],[.78,.52],[.89,.69],[.95,.78],[.956,.8],[.94,.818],[.91,.818],[.88,.77],[.827,.685],[.715,.52],[.555,.34],[.40,.24],[.3,.2],[0,.2]],ceramic,'Bowl scalloped shell',{flutes:10,amp:.085,organic:.012});b.userData.part='body';g.add(b);const f=mesh(new T.CylinderGeometry(.33,.32,.075,96),footMat,'Bowl foot');f.position.y=.04;f.userData.part='foot';g.add(f);return g;}
function makePlate(){const g=new T.Group();g.name='Pearl Plate';const p=profileMesh([[0,.05],[.8,.05],[1.02,.07],[1.17,.13],[1.28,.19],[1.34,.218],[1.35,.24],[1.343,.26],[1.32,.272],[1.282,.268],[1.26,.24],[1.22,.226],[1.197,.24],[1.165,.242],[1.105,.19],[1.025,.145],[.94,.115],[0,.115]],ceramic,'Plate double rim',{flutes:12,amp:.065});p.userData.part='body';g.add(p);const trim=profileMesh([[1.321,.268],[1.343,.27],[1.35,.26],[1.344,.246]],footMat,'Plate champagne scalloped rim',{flutes:12,amp:.065});trim.userData.part='lip';g.add(trim);const f=mesh(new T.CylinderGeometry(.66,.64,.06,96),footMat,'Plate recessed foot');f.position.y=.029;f.userData.part='foot';g.add(f);return g;}
const factories={pitcher:makePitcher,cup:makeCup,bowl:makeBowl,plate:makePlate};
const arrangements={pitcher:[1.25,0,-.66,.2],cup:[2.04,0,1.10,-.50],bowl:[-.07,0,.80,0],plate:[-.91,0,-.70,-.12]};
let dimensionGroup=null,currentGroups=[];
function disposeModel(){assetRoot.children.slice().forEach(o=>{o.traverse(m=>{if(m.isMesh)m.geometry.dispose();});assetRoot.remove(o);});}
function chooseObject(){disposeModel();currentGroups=[];const types=state.object==='collection'?['pitcher','cup','bowl','plate']:[state.object];types.forEach(type=>{const g=factories[type]();const pos=state.object==='collection'?arrangements[type]:[1,0,0,-.25];g.position.set(pos[0],pos[1],pos[2]);g.rotation.y=pos[3];g.userData.type=type;g.traverse(o=>{if(o.isMesh)o.userData.original=o.position.clone();});assetRoot.add(g);currentGroups.push(g);});applyExplosion();buildDimensions();}
function applyExplosion(){const ex=state.explode/100;currentGroups.forEach(g=>g.traverse(o=>{if(!o.isMesh)return;o.position.copy(o.userData.original);if(o.userData.part==='handle')o.position.x+=ex*.80;else if(o.userData.part==='foot')o.position.y-=ex*.6;else if(o.userData.part==='body')o.position.y+=ex*.55;else if(o.userData.part==='lip')o.position.y+=ex*1.0;}));stage.visible=state.explode<8;ground.position.y=state.explode<8?-.20:-.75;}
function buildDimensions(){if(dimensionGroup){dimensionGroup.traverse(o=>{o.geometry?.dispose();o.material?.dispose();});scene.remove(dimensionGroup);}dimensionGroup=new T.Group();dimensionGroup.visible=state.dimensions;const box=new T.Box3().setFromObject(assetRoot);const helper=new T.Box3Helper(box,new T.Color('#d4aa70'));dimensionGroup.add(helper);scene.add(dimensionGroup);}
function applyFinish(){const f=finishes[state.finish];ceramic.color.set(f.color);ceramic.roughness=f.rough;footMat.color.set(f.foot);footMat.metalness=f.metal;}
function applyLighting(){const mode=state.lighting;const blueprint=mode==='blueprint';ceramic.wireframe=blueprint;footMat.wireframe=blueprint;ceramic.color.set(blueprint?'#cfedff':finishes[state.finish].color);footMat.color.set(blueprint?'#8ab9dd':finishes[state.finish].foot);const bg=mode==='daylight'?'#eee1df':mode==='golden'?'#4b3025':blueprint?'#11334b':'#473b40';scene.background.set(bg);scene.fog.color.set(bg);ground.material.color.set(mode==='daylight'?'#eee1df':mode==='golden'?'#644536':blueprint?'#11334b':'#4d4146');plinthMat.color.set(mode==='daylight'?'#d4bab3':mode==='golden'?'#826049':'#ad8991');ambient.intensity=mode==='daylight'?2.1:blueprint?3:1.4;key.intensity=mode==='golden'?5.4:4.3;key.color.set(mode==='golden'?'#ffc57d':'#fff1cf');rim.intensity=mode==='gallery'?3:1.3;renderer.toneMappingExposure=mode==='daylight'?.93:1;arch.visible=!blueprint;stage.visible=!blueprint&&state.explode<8;root.querySelector('.solar-headline').style.color=mode==='daylight'?'#2c372d':'#e9e3d6';root.querySelector('.solar-headline p').style.color=mode==='daylight'?'#4f5f4c':'#bbc4b7';root.querySelector('.solar-kicker').style.color=mode==='daylight'?'#4f5f4c':'#bfc6b7';root.querySelector('.solar-scene-caption').style.color=mode==='daylight'?'#374a38':'#cbd2c3';}
function cameraUpdate(){camera.position.set(target.x+distance*Math.sin(yaw)*Math.cos(pitch),target.y+distance*Math.sin(pitch),target.z+distance*Math.cos(yaw)*Math.cos(pitch));camera.lookAt(target);}
function draw(){cameraUpdate();renderer.render(scene,camera);}
function fit(){const w=container.clientWidth,h=container.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();if(w<420){distance=14;target.set(.75,1.25,0);camera.setViewOffset(w,h,-w*.02,-h*.12,w,h);}else{distance=state.object==='collection'?12:8.6;target.set(.7,1.12,0);camera.setViewOffset(w,h,-w*.12,0,w,h);}draw();}
function ui(){root.querySelectorAll('[data-object]').forEach(b=>{const yes=b.dataset.object===state.object;b.classList.toggle('is-selected',yes);b.setAttribute('aria-pressed',yes);});root.querySelectorAll('[data-finish]').forEach(b=>{const yes=b.dataset.finish===state.finish;b.classList.toggle('is-selected',yes);b.setAttribute('aria-pressed',yes);});root.querySelector('#solar-spec').textContent=descriptors[state.object];root.querySelector('#solar-object-title').textContent=state.object==='collection'?'THE COMPLETE COLLECTION':currentGroups[0]?.name.toUpperCase();root.querySelector('#solar-explode-value').textContent=state.explode?state.explode+'% separated':'Assembled';root.querySelector('#solar-explode').value=state.explode;root.querySelector('#solar-light-select').value=state.lighting;root.querySelector('#solar-dimensions').setAttribute('aria-pressed',state.dimensions);}
function save(){window.openai?.setWidgetState?.({modelContent:{concept:'HUWA Table Charm',object:state.object,finish:state.finish,lighting:state.lighting,exploded:state.explode},privateContent:state}).catch(()=>{});}
function change(next,remember=true){const prev=state.object;Object.assign(state,next);if(prev!==state.object)chooseObject();applyFinish();applyExplosion();applyLighting();buildDimensions();ui();fit();if(remember)save();}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.object)change({object:b.dataset.object});if(b.dataset.finish)change({finish:b.dataset.finish});if(b.id==='solar-dimensions')change({dimensions:!state.dimensions});if(b.id==='solar-reset'){yaw=.4;pitch=.28;change({explode:0,dimensions:false});}});
root.querySelector('#solar-light-select').addEventListener('change',e=>change({lighting:e.target.value}));root.querySelector('#solar-explode').addEventListener('input',e=>{state.explode=+e.target.value;applyExplosion();buildDimensions();ui();draw();});root.querySelector('#solar-explode').addEventListener('change',save);
let drag=false,x=0,y=0,syaw=0,spitch=0;renderer.domElement.addEventListener('pointerdown',e=>{drag=true;x=e.clientX;y=e.clientY;syaw=yaw;spitch=pitch;renderer.domElement.setPointerCapture(e.pointerId);});renderer.domElement.addEventListener('pointermove',e=>{if(!drag)return;yaw=syaw-(e.clientX-x)*.007;pitch=Math.max(.05,Math.min(1.3,spitch+(e.clientY-y)*.005));draw();});['pointerup','pointercancel'].forEach(type=>renderer.domElement.addEventListener(type,()=>drag=false));renderer.domElement.addEventListener('wheel',e=>{if(!e.ctrlKey)return;e.preventDefault();distance=Math.max(4.7,Math.min(19,distance+e.deltaY*.008));draw();},{passive:false});
const saved=window.openai?.widgetState?.privateContent;if(saved&&factories[saved.object]||saved?.object==='collection'){if(finishes[saved.finish])Object.assign(state,saved);}
window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.privateContent;if(s&&finishes[s.finish]&&([...Object.keys(factories),'collection'].includes(s.object)))change(s,false);});
chooseObject();applyFinish();applyLighting();ui();new ResizeObserver(fit).observe(container);fit();root.querySelector('#solar-loading').hidden=true;
// The same geometry drives the interactive model, slide renders, and GLB exports.
globalThis.SolarStudio={state,scene,camera,renderer,assetRoot,change,render(options={}){if(options.width){renderer.setPixelRatio(1);renderer.setSize(options.width,options.height,false);camera.aspect=options.width/options.height;camera.clearViewOffset();camera.updateProjectionMatrix();}if(options.object)state.object=options.object;if(options.finish)state.finish=options.finish;if(options.lighting)state.lighting=options.lighting;state.explode=options.explode||0;state.dimensions=!!options.dimensions;chooseObject();applyFinish();applyExplosion();applyLighting();dimensionGroup.visible=state.dimensions;root.querySelector('.solar-headline').hidden=true;if(options.shift){assetRoot.position.set(...options.shift);}else assetRoot.position.set(0,0,0);yaw=options.yaw??.38;pitch=options.pitch??.30;distance=options.distance??9.3;target.set(...(options.target||[.6,1.12,0]));if(options.mode==='materials'){disposeModel();['kiln','chalk','basalt','sage'].forEach((f,i)=>{const g=makePitcher();g.position.set(-3.75+i*2.5,0,0);g.rotation.y=-.1;g.traverse(o=>{if(o.isMesh){o.material=o.material.clone();const def=finishes[f];o.material.color.set(o.userData.part==='foot'||o.name==='Handle inset'?def.foot:def.color);o.material.roughness=def.rough;}});assetRoot.add(g);});stage.visible=false;}draw();return renderer.domElement.toDataURL('image/png');},geometry(){assetRoot.updateMatrixWorld(true);const meshes=[];assetRoot.traverse(m=>{if(!m.isMesh)return;const p=m.geometry.attributes.position,n=m.geometry.attributes.normal,u=m.geometry.attributes.uv;const ps=[],ns=[],uv=[];const normalMatrix=new T.Matrix3().getNormalMatrix(m.matrixWorld);for(let i=0;i<p.count;i++){const v=new T.Vector3().fromBufferAttribute(p,i).applyMatrix4(m.matrixWorld).multiplyScalar(.1);ps.push(v.x,v.y,v.z);const nn=new T.Vector3().fromBufferAttribute(n,i).applyMatrix3(normalMatrix).normalize();ns.push(nn.x,nn.y,nn.z);if(u)uv.push(u.getX(i),u.getY(i));}meshes.push({name:m.name,positions:ps,normals:ns,uvs:uv,indices:m.geometry.index?Array.from(m.geometry.index.array):Array.from({length:p.count},(_,i)=>i),material:{name:m.material===footMat?'Contrasting foot ring':'Ceramic glaze',color:[m.material.color.r,m.material.color.g,m.material.color.b,1],roughness:m.material.roughness,metalness:m.material.metalness||0}});});return{meshes,unit:'metre',concept:'HUWA Table Charm',texture:grain.image.toDataURL('image/png')};}};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.type!=='huwa-model')return;const objects=['collection','pitcher','cup','bowl','plate'];if(objects.includes(e.data.object)&&finishes[e.data.finish])change({object:e.data.object,finish:e.data.finish,explode:0},false);});
})();
