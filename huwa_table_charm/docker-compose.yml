services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: huwa_table_charm
      POSTGRES_USER: huwa
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huwa -d huwa_table_charm"]
      interval: 5s
      timeout: 5s
      retries: 15
    restart: unless-stopped
  backend:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_NAME: huwa_table_charm
      DB_USER: huwa
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET}
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      db: {condition: service_healthy}
    restart: unless-stopped
  frontend:
    build: {context: ./frontend, dockerfile: Dockerfile}
    ports: ["127.0.0.1:8080:80"]
    depends_on: [backend]
    restart: unless-stopped
volumes:
  pgdata:
